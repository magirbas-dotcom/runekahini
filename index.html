<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Zoom is locked: pinch-zooming the PWA threw the fixed realm scene and
         particle canvas out of place. Body text is 16px and inputs are 16px,
         so nothing needs zoom to be read, and iOS will not auto-zoom on focus.
         iOS Safari ignores user-scalable=no, hence the CSS touch-action and
         gesture handlers too (index.css, main.tsx). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0a09" />
    <meta
      name="description"
      content="Elder Futhark Rune okuması, Doğum Rune'si hesaplayıcısı ve tılsım tasarımcısı."
    />
    <title>Rune Kahini</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
